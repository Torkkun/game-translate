# gtl (Go): 整形・vet・lint・テスト・ビルド
name: CI / Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal magefiles)"
          if [ -n "$out" ]; then
            echo "gofmt で整形されていないファイル:"; echo "$out"; exit 1
          fi
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet -tags mage ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags mage
      - name: go test
        run: go test -race ./...
      - name: build
        run: |
          go build -o /dev/null ./cmd/gtl
          go run mage.go -l > /dev/null   # mage のタスクが組み立てられるか
