# シェルスクリプト: shellcheck
name: CI / Shell

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt/r" -w /mnt/r koalaman/shellcheck:v0.11.0 \
            scripts/*.sh
      - name: compose.yaml
        run: docker compose config -q
